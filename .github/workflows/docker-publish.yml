name: Build & Publish Docker Image (Tier 1 - zero build di server)

# Kompilasi TypeScript & build image dilakukan di runner GitHub
# (RAM besar, gratis untuk repo publik/privat dalam batas wajar),
# BUKAN di server hosting kamu yang resource-nya terbatas.
# Platform hosting tinggal "deploy dari image" (bukan "build dari
# Dockerfile") - lihat catatan di bawah untuk cara pakai per platform.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile.prebuilt"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install semua dependency (termasuk TypeScript)
        run: npm ci

      - name: Compile TypeScript -> dist/
        run: npm run build

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image ringan (pakai Dockerfile.prebuilt)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prebuilt
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/harpitnas-api:latest
            ghcr.io/${{ github.repository_owner }}/harpitnas-api:${{ github.sha }}

# Setelah workflow ini sukses sekali, image ada di:
#   ghcr.io/vandpurnama/harpitnas-api:latest
# Default GHCR package private; kalau platform hosting minta image
# publik, buka Settings paket di GitHub -> Change visibility -> Public,
# atau buat Personal Access Token (scope read:packages) untuk platform
# hosting login ke ghcr.io.
