name: Build & Publish Docker Image (Tier 1)

# Build TypeScript + image di GitHub Actions (RAM besar).
# Hosting hanya pull image — tidak compile di server sempit.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile.prebuilt"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm ci sering crash "Exit handler never called" di beberapa runner.
      # Fallback ke npm install; pin TypeScript 5.6.2 di package.json.
      - name: Install dependencies
        run: |
          set -e
          npm install --no-audit --no-fund --prefer-offline=false
          # Pastikan tsc tersedia (jaring pengaman)
          npx tsc --version

      - name: Compile TypeScript
        run: npm run build

      - name: Verify dist exists
        run: |
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
          ls -la dist/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prebuilt
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/harpitnas-api:latest
            ghcr.io/${{ github.repository_owner }}/harpitnas-api:${{ github.sha }}
